spring:
  application:
    name: family-os
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:family_os}?serverTimezone=UTC&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:family_os}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate          # 스키마 진실은 Flyway. JPA는 검증만
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC          # Instant → UTC 저장 보장
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

# Hermes(텔레그램 봇) 내부 API 서비스 토큰 — 비어있으면 텔레그램 내부 API 전면 차단(fail-closed)
hermes:
  service-token: ${HERMES_SERVICE_TOKEN:}

# 구글 캘린더 연동 (OAuth2). 미설정 시 연동 비활성
google:
  client-id: ${GOOGLE_CLIENT_ID:}
  client-secret: ${GOOGLE_CLIENT_SECRET:}
  redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/v1/integrations/google/callback}
  token-enc-key: ${GOOGLE_TOKEN_ENC_KEY:}   # Base64 32바이트(AES-256). refresh token 암호화
  # 정기 폴링(증분 sync + PENDING push). 푸시 webhook 의 신뢰성 폴백이자 기본 동기화 메커니즘
  poll:
    enabled: ${GOOGLE_POLL_ENABLED:true}
    interval-ms: ${GOOGLE_POLL_INTERVAL_MS:900000}        # 15분
    initial-delay-ms: ${GOOGLE_POLL_INITIAL_DELAY_MS:120000}  # 기동 2분 후 첫 실행
  # 푸시 webhook(Phase 3). 공개 HTTPS 수신 URL·도메인 인증(Cloudflare) 필요 → 기본 비활성
  push:
    enabled: ${GOOGLE_PUSH_ENABLED:false}
    callback-url: ${GOOGLE_PUSH_CALLBACK_URL:}   # 예: https://<공개도메인>/api/v1/integrations/google/notifications
    token: ${GOOGLE_PUSH_TOKEN:}                  # 채널 토큰(임의 시크릿) — 수신 시 일치 검증

# MyBatis: family_id/deleted_at 는 매퍼 WHERE 에 직접 명시 (자동필터 미적용)
mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

# JWT — 시크릿은 반드시 환경변수로 외부화 (하드코딩·커밋 금지)
jwt:
  access-secret: ${JWT_ACCESS_SECRET}     # HS256: 최소 32바이트 이상
  refresh-secret: ${JWT_REFRESH_SECRET}
  access-ttl: PT30M                        # 30분
  refresh-ttl: P14D                        # 14일
  refresh-grace: PT10S                     # 회전 직후 동시요청 레이스 유예(재사용 오탐 방지)

# CORS 허용 오리진 (웹). 앱은 네이티브라 CORS 무관
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:19006}

  # 파일 스토리지 (외장 SSD 우선, 클라우드 이식 가능)
  storage:
    local-root: ${STORAGE_LOCAL_ROOT:./var/storage}
    url-secret: ${STORAGE_URL_SECRET}       # 서명 URL HMAC 시크릿 (.env, 커밋 금지)
    url-ttl: PT10M                            # 서명 조회 URL 유효시간

  # 최초 부트스트랩 — DB 가 비어있을 때만 1회 시드(멱등). 자격증명은 .env 로만 주입(커밋 금지)
  bootstrap:
    enabled: ${BOOTSTRAP_ENABLED:true}
    login-id: ${BOOTSTRAP_LOGIN_ID:}      # 미설정 시 시드 생략 (앱 기동은 정상)
    password: ${BOOTSTRAP_PASSWORD:}      # 평문은 .env 에만. 해시는 런타임 생성
    parent-name: ${BOOTSTRAP_PARENT_NAME:부모}
    family-name: ${BOOTSTRAP_FAMILY_NAME:우리 가족}
    timezone: ${BOOTSTRAP_TIMEZONE:Asia/Seoul}
