plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
}

group = 'com.familyos'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot BOM — Gradle 네이티브 platform() 으로 직접 import (Boot 4 권장 방식)
    implementation platform('org.springframework.boot:spring-boot-dependencies:4.1.0')

    // --- Web / Security / JPA ---
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    // Boot 4 에서 spring-boot-starter-aop → spring-boot-starter-aspectj 로 개명 (FamilyFilterAspect 의 @Aspect 용)
    implementation 'org.springframework.boot:spring-boot-starter-aspectj'

    // --- MyBatis (타임라인·통계·검색) ---
    // 4.0.x = Spring Boot 4.0/4.1 / MyBatis-Spring 4.0 / Java 17+ 지원
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:4.0.1'

    // --- Migration / DB (버전은 Boot BOM 관리) ---
    // Boot 4 는 flyway-core 만으론 Flyway 자동구성 안 됨 → starter 필요. MySQL 모듈은 BOM 관리되는 flyway-mysql.
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-mysql'
    runtimeOnly 'com.mysql:mysql-connector-j'

    // --- JWT (jjwt) ---
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // --- JSpecify null 안정성 (Spring Framework 7) ---
    implementation 'org.jspecify:jspecify:1.0.0'

    // --- Test (버전은 Boot BOM 관리) ---
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
}

tasks.named('test') {
    useJUnitPlatform()
}
