# Family OS 통합 배포 — 별도 compose + 기존 stock-network-v2 공유
# 설계: scratchpad/deploy-integration-plan.md, phase-drafts.md (Phase 2)
# 사용 전: cp .env.example .env 후 값 채우기. 외부 네트워크는 stock compose가 생성한 것 재사용.

services:
  family-os-api:
    build: ./backend
    container_name: family-os-api
    env_file: .env
    environment:
      TZ: Asia/Seoul
    # 평시 nginx가 네트워크로 라우팅. 디버그 필요 시 주석 해제
    # ports: ["8087:8080"]
    volumes:
      - /Volumes/ServerData/docker/family-os/photos:/data/photos
    restart: always
    networks: [stock-network-v2]

  family-os-web:
    build:
      context: ./frontend
      args:
        EXPO_PUBLIC_API_BASE_URL: ${EXPO_PUBLIC_API_BASE_URL}
    container_name: family-os-web
    restart: always
    networks: [stock-network-v2]

  family-os-mcp:
    build: ./mcp
    container_name: family-os-mcp
    env_file: .env
    environment:
      FAMILYOS_API_BASE_URL: http://family-os-api:8080/api/v1
      PORT: "3000"
    ports:
      - "8088:3000"   # Hermes(호스트)가 localhost:8088 로 접근 (Tailscale)
    depends_on: [family-os-api]
    restart: always
    networks: [stock-network-v2]

networks:
  stock-network-v2:
    external: true
