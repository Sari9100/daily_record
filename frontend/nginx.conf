# family-os-web 컨테이너 내부 nginx — SPA 정적 서빙(라우팅 fallback)
# 엣지(stock-nginx-v2)가 / → family-os-web:80, /api/ → family-os-api:8080 로 분기.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 이 컨테이너는 TLS를 모르는 순수 HTTP 서버라, 자동 trailing-slash 301 리다이렉트의 기본값이
    # http:// 절대경로로 생성되어 엣지(Cloudflare) 구간에서 403이 났다. 상대경로로 바꿔 스킴 문제를 없앤다.
    absolute_redirect off;

    # expo export(static)는 하위 라우트가 있는 경로(schedule/diary/transaction/collection)를
    # "schedule.html"(평면 파일)과 "schedule/[id].html","schedule/new.html"(디렉토리, index 없음)
    # 형태로 같이 내보낸다. $uri/ 를 쓰면 index 없는 그 디렉토리에 먼저 매칭돼 403이 나므로 제외하고,
    # 평면 파일은 $uri.html 로, id 등 동적 세그먼트는 SPA 셸(index.html)로 폴백해 클라이언트 라우팅에 맡긴다.
    location / {
        try_files $uri $uri.html /index.html;
    }
}
