# 참고용 스니펫 — 서버의 /Volumes/ServerData/config/nginx-v2.conf 의
# "가계부 도메인" server 블록을 아래처럼 family-os 로 교체(직접 편집은 서버에서).
# 설계: scratchpad/phase-drafts.md (Phase 5). server_name/기존 블록은 실제 conf 확인 후 정확히 반영.
# 롤백: 블록 원복 + `docker exec stock-nginx-v2 nginx -s reload`. Cloudflare 무변경.

server {
    listen 80;
    server_name ledger.saristock.com;

    # API → family-os-api (기존 ledger 백엔드 대체)
    location /api/ {
        proxy_pass http://family-os-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 30m;   # 사진 업로드
    }

    # 웹 정적 → family-os-web (기존 ledger-app-v2 대체)
    location / {
        proxy_pass http://family-os-web:80;
        proxy_set_header Host $host;
    }
}
